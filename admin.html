<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - PAW PATROL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#fffdf8] min-h-screen p-6">
<nav class="max-w-5xl mx-auto flex justify-between items-center bg-white border rounded-full px-5 py-3 shadow-sm"><a href="index.html" class="font-bold text-sm">🐾 PAW PATROL <span class="text-zinc-400 font-normal">Admin</span></a><div class="flex gap-2"><button onclick="clearReports()" class="text-xs font-bold px-4 py-2 rounded-full border">Clear</button><a href="index.html" class="bg-black text-white text-xs font-bold px-4 py-2 rounded-full">Home</a></div></nav>
<div class="max-w-5xl mx-auto mt-8">
  <div class="grid grid-cols-3 gap-4">
    <div class="bg-white border rounded-2xl p-6 shadow-sm"><p class="text-[11px] text-zinc-400 font-bold tracking-widest">PENDING</p><p class="text-3xl font-black mt-1" id="pendingCount">0</p><div class="h-1.5 bg-yellow-300 rounded-full mt-4"></div></div>
    <div class="bg-white border rounded-2xl p-6 shadow-sm"><p class="text-[11px] text-zinc-400 font-bold tracking-widest">RESCUED</p><p class="text-3xl font-black mt-1" id="rescuedCount">0</p><div class="h-1.5 bg-green-400 rounded-full mt-4"></div></div>
    <div class="bg-black text-white rounded-2xl p-6"><p class="text-[11px] text-zinc-400 font-bold tracking-widest">TOTAL</p><p class="text-3xl font-black mt-1" id="totalCount">0</p><div class="h-1.5 bg-yellow-300 rounded-full mt-4"></div></div>
  </div>
  <div id="reportsList" class="mt-6 grid md:grid-cols-2 gap-4"></div>
</div>
<script>
function loadReports(){
  const reports=JSON.parse(localStorage.getItem('paw_reports')||'[]');
  document.getElementById('pendingCount').innerText=reports.filter(r=>r.status=='Pending').length;
  document.getElementById('rescuedCount').innerText=reports.filter(r=>r.status=='Rescued').length;
  document.getElementById('totalCount').innerText=reports.length;
  const list=document.getElementById('reportsList');
  if(!reports.length){list.innerHTML=`<div class='col-span-2 bg-white border rounded-2xl p-12 text-center'><p class='text-sm font-bold'>No reports yet</p><p class='text-xs text-zinc-400 mt-1'>Upload a report with picture</p></div>`;return;}
  list.innerHTML=reports.map(r=>`<div class="bg-white border rounded-2xl overflow-hidden shadow-sm"><img src="${r.photo}" class="w-full h-48 object-cover"><div class="p-4"><div class="flex justify-between"><p class="text-sm font-bold">${r.location} • ${r.type}</p><span class="text-[10px] px-2 py-1 rounded-full font-bold ${r.status=='Pending'?'bg-yellow-100 text-yellow-700':'bg-green-100 text-green-700'}">${r.status}</span></div><p class="text-xs text-zinc-500 mt-1">${r.condition} • ${r.urgency}</p><p class="text-[10px] text-zinc-400 mt-3">${r.time}</p><button onclick="markRescued(${r.id})" class="w-full mt-3 bg-yellow-300 border border-black py-2 rounded-full text-xs font-bold">${r.status=='Pending'?'Mark as Rescued':'Done ✓'}</button></div></div>`).join('');
}
function markRescued(id){let reports=JSON.parse(localStorage.getItem('paw_reports')||'[]');reports=reports.map(r=>r.id==id?{...r,status:'Rescued'}:r);localStorage.setItem('paw_reports',JSON.stringify(reports));loadReports();}
function clearReports(){if(confirm('Clear all?')){localStorage.removeItem('paw_reports');loadReports();}}
loadReports();
</script>
</body>
</html>
